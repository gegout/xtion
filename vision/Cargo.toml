[package]
name = "xtion-vision"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
xtion = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
font8x8 = "0.3"
base64 = "0.22"
reqwest = {version = "0.13",default-features=false,features=["json","rustls"]}
tokio = {version="1",features=["rt","time","sync","macros"]}
eframe = {version="0.37",default-features=false,features=["glow","default_fonts","wayland","x11"]}
