[package]
name = "xtion-vision"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local, depth-only scene perception and optional grounded vision interpretation"

[features]
default = ["ai","desktop"]
desktop = ["dep:eframe"]
ai = ["dep:base64", "dep:reqwest", "dep:tokio"]

[dependencies]
xtion = { version = "0.1.0", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = {version="1", features=["float_roundtrip"]}
png = "0.18"
font8x8 = "0.3"
base64 = { version = "0.22", optional = true }
reqwest = {optional=true,version = "0.13",default-features=false,features=["json","rustls"]}
tokio = {optional=true,version="1",features=["rt","time","sync","macros"]}
eframe = {optional=true,version="0.37",default-features=false,features=["glow","default_fonts","wayland","x11","clipboard"]}
ctrlc = {version="3.5",features=["termination"]}

[[bin]]
name = "xtion-vision"
path = "src/main.rs"
required-features = ["desktop"]
